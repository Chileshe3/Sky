<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Hanken+Grotesk:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="bar" id="bar"></header>
  <main>
    <div class="page-head">
      <h1>Gallery</h1>
      <div class="filters" id="filters" role="group" aria-label="Filter by category"></div>
    </div>
    <div class="wrap">
      <p class="note" id="note" hidden></p>
      <div class="masonry" id="grid"></div>
    </div>
  </main>
  <footer class="foot" id="foot"></footer>

  <div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photograph viewer">
    <button class="lb-close" id="lb-close" aria-label="Close viewer">×</button>
    <button class="lb-nav prev" id="lb-prev" aria-label="Previous photograph">‹</button>
    <figure><img id="lb-img" alt=""></figure>
    <button class="lb-nav next" id="lb-next" aria-label="Next photograph">›</button>
    <div class="lb-cap" id="lb-cap"></div>
  </div>

  <script type="module" src="/js/gallery.js"></script>
</body>
</html>
