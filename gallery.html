<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Hanken+Grotesk:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="bar" id="bar"></header>
  <main>
    <div class="page-head">
      <h1 id="title">Gallery</h1>
    </div>
    <div class="wrap">
      <p class="note" id="note" hidden></p>
      <div class="grid" id="grid"></div>
      <div class="more-row">
        <button class="btn" id="more" type="button" hidden>Load more</button>
        <p class="end" id="end" hidden>That's every photograph.</p>
      </div>
    </div>
  </main>
  <footer class="foot" id="foot"></footer>
  <script type="module" src="/js/gallery.js"></script>
</body>
</html>
